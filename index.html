let currentFont=Number(localStorage.bbibiFont||1);
if(![1,2,9,11,13,14].includes(currentFont)) currentFont=1;
const fonts=[{name:'온글잎 윤탱체',cls:1},{name:'서초바탕',cls:2},{name:'G마켓산스',cls:9},{name:'이서윤체',cls:11},{name:'제주돌담체',cls:13},{name:'조선굴림체',cls:14}];
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');if(id==='list')loadFriends()}
async function ensureUser(){
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){currentUser=session.user;return currentUser}
  const {data,error}=await sb.auth.signInAnonymously();
  if(error)throw error; currentUser=data.user; return currentUser;
}
async function verify(){
  try{localStorage.bbibiPhone=normalizePhone(document.getElementById('phoneInput').value);await ensureUser();go('profile')}
  catch(e){alert('Supabase 로그인 연결을 확인해줘.\n'+e.message)}
}
async function saveName(){
  const n=document.getElementById('nameInput').value.trim()||'나';
  try{await ensureUser();const {error}=await sb.from('profiles').upsert({id:currentUser.id,name:n,phone:localStorage.bbibiPhone||null});if(error)throw error;localStorage.bbibiName=n;localStorage.bbibiOn='1';go('list')}
  catch(e){alert('프로필 저장 실패: '+e.message)}
}
function normalizePhone(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('82'))d='0'+d.slice(2);return d}
async function loadFriends(){
  const el=document.getElementById('rows'); el.innerHTML="<div class='emptyFriends'>친구를 불러오는 중...</div>";
  try{await ensureUser();const {data:links,error}=await sb.from('friends').select('friend_id').eq('user_id',currentUser.id);if(error)throw error;const ids=(links||[]).map(x=>x.friend_id);if(!ids.length){contacts=[];return renderRows()}const {data:ps,error:pe}=await sb.from('profiles').select('id,name,phone').in('id',ids);if(pe)throw pe;contacts=(ps||[]).map(p=>({id:p.id,name:p.name||'삐삐 친구',phone:p.phone||''}));renderRows()}catch(e){el.innerHTML="<div class='emptyFriends'>친구 목록을 불러오지 못했어.<br><small>친구용 SQL을 먼저 실행해줘.</small></div>";console.warn(e)}
}
function renderRows(){let el=document.getElementById('rows');if(!contacts.length){el.innerHTML="<div class='emptyFriends'>아직 친구가 없어.<br>오른쪽 위 ＋로 친구를 추가해봐.</div>";return}el.innerHTML=contacts.map(c=>`<div class='chatrow' onclick="openChat('${c.id}','${escapeHtml(c.name).replace(/'/g,"&#39;")}')"><div class='avatar'>${escapeHtml((c.name||'?')[0])}</div><div class='grow'><div class='name'>${escapeHtml(c.name)}</div><div class='preview'>대화를 시작해봐</div></div></div>`).join('')}
function roomKey(uid){return 'bbibi_room_'+uid}
async function getOrCreateRoom(friendId){
  await ensureUser();let rid=localStorage.getItem(roomKey(friendId));
  if(rid){const {data}=await sb.from('chat_members').select('room_id').eq('room_id',rid).eq('user_id',currentUser.id).maybeSingle();if(data)return rid;localStorage.removeItem(roomKey(friendId))}
  const {data:mine,error:merr}=await sb.from('chat_members').select('room_id').eq('user_id',currentUser.id);if(merr)throw merr;
  for(const m of (mine||[])){const {data:other}=await sb.from('chat_members').select('user_id').eq('room_id',m.room_id).eq('user_id',friendId).maybeSingle();if(other){localStorage.setItem(roomKey(friendId),m.room_id);return m.room_id}}
  const {data,error}=await sb.from('chat_rooms').insert({}).select('id').single();if(error)throw error;rid=data.id;
  const {error:me}=await sb.from('chat_members').insert([{room_id:rid,user_id:currentUser.id},{room_id:rid,user_id:friendId}]);if(me)throw me;localStorage.setItem(roomKey(friendId),rid);return rid;
}
async function openChat(friendId,n){current=friendId;document.getElementById('chatName').textContent=n;go('chat');document.getElementById('msgs').innerHTML="<div class='sub' style='text-align:center;margin-top:20px'>불러오는 중...</div>";try{currentRoom=await getOrCreateRoom(friendId);await renderMsgs();subscribeRoom()}catch(e){alert('채팅방 연결 실패: '+e.message)}}
function openFriendSheet(){document.getElementById('friendPhone').value='';document.getElementById('friendResult').innerHTML='';document.getElementById('friendSheet').classList.add('on');setTimeout(()=>document.getElementById('friendPhone').focus(),100)}
function closeFriendSheet(){document.getElementById('friendSheet').classList.remove('on')}
async function searchFriend(){
  const box=document.getElementById('friendResult'), phone=normalizePhone(document.getElementById('friendPhone').value);if(phone.length<10){box.innerHTML="<div class='sub'>휴대폰 번호를 확인해줘.</div>";return}
  box.innerHTML="<div class='sub'>찾는 중...</div>";try{await ensureUser();const {data,error}=await sb.from('profiles').select('id,name,phone').eq('phone',phone).maybeSingle();if(error)throw error;if(!data){box.innerHTML="<div class='sub'>아직 삐삐를 사용하지 않아요.</div>";return}if(data.id===currentUser.id){box.innerHTML="<div class='sub'>내 번호는 친구로 추가할 수 없어.</div>";return}const exists=contacts.some(c=>c.id===data.id);box.innerHTML=`<div class='friendPerson'><div class='avatar'>${escapeHtml((data.name||'?')[0])}</div><div class='grow'><div class='name'>${escapeHtml(data.name||'삐삐 사용자')}</div><div class='phoneMini'>${escapeHtml(data.phone||'')}</div></div>${exists?"<span class='sub'>이미 친구예요</span>":`<button class='friendAddBtn' onclick="addFriend('${data.id}')">친구 추가</button>`}</div>`}catch(e){box.innerHTML="<div class='sub'>친구 찾기 실패: "+escapeHtml(e.message)+"</div>"}
}
async function addFriend(friendId){try{await ensureUser();const {error}=await sb.from('friends').upsert([{user_id:currentUser.id,friend_id:friendId},{user_id:friendId,friend_id:currentUser.id}],{onConflict:'user_id,friend_id'});if(error)throw error;await loadFriends();closeFriendSheet()}catch(e){alert('친구 추가 실패: '+e.message)}}
async function fetchMsgs(){if(!currentRoom)return[];const {data,error}=await sb.from('messages').select('*').eq('room_id',currentRoom).order('created_at',{ascending:true});if(error)throw error;return data||[]}
async function renderMsgs(){let e=document.getElementById('msgs');let rows=await fetchMsgs();e.innerHTML='';if(!rows.length)e.innerHTML="<div class='sub' style='text-align:center;margin-top:22px'>첫 삐삐를 보내봐.</div>";rows.forEach(x=>appendMessage(x,e));e.scrollTop=e.scrollHeight}
function appendMessage(x,e=document.getElementById('msgs')){if(e.querySelector(`[data-mid="${x.id}"]`))return;const mine=x.sender_id===currentUser?.id;let node;if(x.type==='ping'){node=document.createElement('div');node.className='pagerEvent';node.innerHTML=(mine?'내가 삐삐를 보냈어요':'삐삐가 왔어요')+'<b>'+escapeHtml(x.content||'')+'</b>'}else if(x.type==='image'){node=document.createElement('img');node.src=x.image_url||'';node.className='photo';node.style.alignSelf=mine?'flex-end':'flex-start'}else{node=document.createElement('div');node.className='bubble '+(mine?'mine':'theirs')+' f'+(Number(x.font)||0);node.textContent=x.content||''}node.dataset.mid=x.id;e.appendChild(node)}
function subscribeRoom(){if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel('room-'+currentRoom).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_id=eq.'+currentRoom},payload=>{appendMessage(payload.new);const e=document.getElementById('msgs');e.scrollTop=e.scrollHeight}).subscribe()}
async function sendMsg(){let i=document.getElementById('msgInput'),v=i.value.trim();if(!v||!currentRoom)return;const {error}=await sb.from('messages').insert({room_id:currentRoom,sender_id:currentUser.id,type:'text',content:v,font:String(currentFont)});if(error)return alert('전송 실패: '+error.message);i.value='';previewTypedFonts();setTimeout(renderMsgs,250)}
async function sendPhoto(ev){let f=ev.target.files[0];if(!f||!currentRoom)return;if(f.size>900000){alert('개발 버전에서는 사진을 900KB 이하로 골라줘. 다음 단계에서 Storage를 붙일게!');return}let r=new FileReader();r.onload=async()=>{const {error}=await sb.from('messages').insert({room_id:currentRoom,sender_id:currentUser.id,type:'image',image_url:r.result});if(error)alert('사진 전송 실패: '+error.message);else setTimeout(renderMsgs,250)};r.readAsDataURL(f)}
function escapeHtml(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function typedPreview(){let v=document.getElementById('msgInput').value.trim();return v||'메시지를 입력해봐'}
function renderFonts(){let g=document.getElementById('fontGrid'),sample=typedPreview();g.innerHTML=fonts.map(f=>`<button class="fontChoice ${f.cls===currentFont?'on':''}" onclick="pickFont(${f.cls})"><span class="fontName">${f.name}</span><span class="fontPreview f${f.cls}">${escapeHtml(sample)}</span></button>`).join('')}
function previewTypedFonts(){if(document.getElementById('fontTray').classList.contains('on'))renderFonts()}
function toggleFonts(){renderFonts();document.getElementById('fontTray').classList.toggle('on')}
function pickFont(i){currentFont=i;localStorage.bbibiFont=String(i);document.getElementById('msgInput').className='f'+i;renderFonts();document.getElementById('msgInput').focus()}
let pagerValue='';function openPager(){pagerValue='';updatePager();document.getElementById('pagerSheet').classList.add('on')}function closePager(){document.getElementById('pagerSheet').classList.remove('on')}function updatePager(){document.getElementById('pagerDisplay').textContent=pagerValue||' '}function pagerDigit(d){if(d==='←')pagerValue=pagerValue.slice(0,-1);else if(d==='C')pagerValue='';else if(pagerValue.length<12)pagerValue+=d;updatePager()}
async function sendPager(){if(!pagerValue||!currentRoom)return;const sent=pagerValue;const {error}=await sb.from('messages').insert({room_id:currentRoom,sender_id:currentUser.id,type:'ping',content:sent});if(error)return alert('삐삐 전송 실패: '+error.message);closePager();setTimeout(renderMsgs,250)}
async function logoutBbibi(){try{if(realtimeChannel){await sb.removeChannel(realtimeChannel);realtimeChannel=null}await sb.auth.signOut();['bbibiOn','bbibiName','bbibiPhone'].forEach(k=>localStorage.removeItem(k));Object.keys(localStorage).filter(k=>k.startsWith('bbibi_room_')).forEach(k=>localStorage.removeItem(k));currentUser=null;currentRoom=null;document.getElementById('phoneInput').value='';document.getElementById('nameInput').value='';go('welcome')}catch(e){alert('로그아웃 실패: '+e.message)}}
document.getElementById('msgInput').className='f'+currentFont;
document.getElementById('fontToggle').addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggleFonts()});
(async function boot(){try{const {data:{session}}=await sb.auth.getSession();if(session?.user){currentUser=session.user;if(localStorage.bbibiOn)go('list')}}catch(e){console.warn(e)}})();
</script></body></html>
